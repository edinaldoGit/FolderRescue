name: FolderRescue CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    name: Portable exFAT Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/FolderRescue.PortableTests/FolderRescue.PortableTests.csproj

      - name: Build portable tests
        run: dotnet build tests/FolderRescue.PortableTests/FolderRescue.PortableTests.csproj --configuration Release --no-restore

      - name: Run portable tests
        run: dotnet run --project tests/FolderRescue.PortableTests/FolderRescue.PortableTests.csproj --configuration Release --no-build --no-restore
